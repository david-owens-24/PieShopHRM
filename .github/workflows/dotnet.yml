# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore

    - id: build
      name: Build      
      run: dotnet build --no-restore

    - id: test
      if: steps.build.outcome == 'success'
      name: Test
      run: dotnet test "PieShopHRM.Tests/PieShopHRM.Tests.csproj" --collect "XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

    - id: coverage
      name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: PieShopHRM.Tests/TestResults/**/coverage.cobertura.xml
        badge: false
        fail_below_min: false        
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: console
